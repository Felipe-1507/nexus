<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src file:; style-src 'unsafe-inline'">
<title>Nexus</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  /* Sem JavaScript o Chromium desenha os controles do player por conta própria: aqui eles não podem aparecer. */
  video::-webkit-media-controls, video::-webkit-media-controls-enclosure { display: none !important; }
  video { pointer-events: none; display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 48px; }
</style></head>
<body><video src="intro.webm" autoplay muted playsinline></video></body></html>
