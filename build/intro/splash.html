  @keyframes glow { from { opacity: 0; } }
  @keyframes breathe { 50% { opacity: .65; } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
