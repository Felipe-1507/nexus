<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Ícone padrão (genérico) do Nexus: um núcleo com uma órbita. O PNG em build/icon.png é gerado a partir deste. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c2e"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b3a8ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#8b7dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c9c2ff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="178" ry="70" fill="none" stroke="#8b7dff" stroke-opacity="0.7" stroke-width="12"
           transform="rotate(-24 256 256)"/>
  <circle cx="256" cy="256" r="66" fill="url(#core)"/>
  <circle cx="383" cy="161" r="22" fill="#5cc8ff"/>
</svg>
